name: Publish Docs

on:
  push:
    branches:
      - main
      # Intended, decided on 2026-11-13: nothing links to the site before 2.0.
      # tasks/rejected/0096-71-docs-published-from-branch.md
      - 96-documentation
  # Build only: a broken link fails the pull request before it reaches main.
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'

# Permissions for direct GitHub Pages access without branches
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --strict turns warnings (a broken link, a missing anchor) into errors.
      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push'
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
