name: CICD

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    

jobs:
  compile:
    
    name: Build > Test > Publish

    runs-on: ubuntu-latest

    env:
      NUGET_ORG_AUTH_TOKEN: ${{secrets.NUGET_ORG_AUTH_TOKEN}}
      SOLUTION_PATH: 'src/DbLive.sln'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # required for GitVersion

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x        

    - name: Install GitVersion (tool)
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true
        configFilePath: .github/GitVersion.yml
        updateAssemblyInfo: false

    - name: Show computed versions
      run: |
        echo "GitVersion FullSemVer: ${{ steps.gitversion.outputs.FullSemVer }}"
        echo "GitVersion SemVer:     ${{ steps.gitversion.outputs.SemVer }}"
        echo "GitVersion NuGetV2:    ${{ steps.gitversion.outputs.NuGetVersionV2 }}"

    # Notes from the "## Release note" sections of the tasks closed since the previous tag. A task without
    # the section fails the release here, before anything is published.
    - name: Build release notes
      if: github.ref == 'refs/heads/main'
      run: dotnet run .github/scripts/release-notes.cs -- --version ${{ steps.gitversion.outputs.SemVer }} --output "$RUNNER_TEMP/release-notes.md"

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }} 

    # One Release build: the tests run on the same assemblies that go into the packages.
    # InformationalVersion is set explicitly because the GitVersion action also exports its outputs
    # as environment variables, and MSBuild would take `informationalVersion` from there.
    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release -p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} -p:InformationalVersion=${{ steps.gitversion.outputs.NuGetVersionV2 }}

    - name: Test
      run: dotnet test ${{ env.SOLUTION_PATH }} --filter "Category!=LocalOnly" --no-build --configuration Release --verbosity normal

    # Version is needed again: it sets the package version and the DbLive dependency version.
    # The packages of this build go to one folder, a local feed for the package tests below.
    - name: Create DbLive package
      run: dotnet pack 'src/DbLive/DbLive.csproj' --no-build --configuration Release -p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} --output "$RUNNER_TEMP/packages"

    - name: Create DbLive.xunit package
      run: dotnet pack 'src/DbLive.xunit/DbLive.xunit.csproj' --no-build --configuration Release -p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} --output "$RUNNER_TEMP/packages"

    - name: Create DbLive.MSSQL package
      run: dotnet pack 'src/DbLive.MSSQL/DbLive.MSSQL.csproj' --no-build --configuration Release -p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} --output "$RUNNER_TEMP/packages"

    - name: Create DbLive.PostgreSQL package
      run: dotnet pack 'src/DbLive.PostgreSQL/DbLive.PostgreSQL.csproj' --no-build --configuration Release -p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} --output "$RUNNER_TEMP/packages"

    - name: Create DbLive.Testcontainers.MSSQL package
      run: dotnet pack 'src/DbLive.Testcontainers.MSSQL/DbLive.Testcontainers.MSSQL.csproj' --no-build --configuration Release -p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} --output "$RUNNER_TEMP/packages"

    - name: Create DbLive.Testcontainers.PostgreSQL package
      run: dotnet pack 'src/DbLive.Testcontainers.PostgreSQL/DbLive.Testcontainers.PostgreSQL.csproj' --no-build --configuration Release -p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} --output "$RUNNER_TEMP/packages"

    # Builds projects that reference the packages, as a user project does: the DbLive package embeds the
    # Scripts folder without a block in the .csproj, and the fixture builders compile with one package reference.
    - name: Test packages
      run: dotnet run .github/scripts/package-tests.cs -- --packages "$RUNNER_TEMP/packages"

    # Pushes the .snupkg next to each .nupkg too. Quoted: dotnet expands the wildcard.
    - name: Publish packages
      if: github.ref == 'refs/heads/main'
      run: |
        dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" \
          --source https://api.nuget.org/v3/index.json \
          --api-key $NUGET_ORG_AUTH_TOKEN \
          --skip-duplicate

    - name: Configure git
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

    - name: Create git tag
      if: github.ref == 'refs/heads/main'
      run: git tag ${{ steps.gitversion.outputs.SemVer }}

    - name: Push git tag
      if: github.ref == 'refs/heads/main'
      run: git push origin ${{ steps.gitversion.outputs.SemVer }}

    - name: Create GitHub release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create ${{ steps.gitversion.outputs.SemVer }} --verify-tag --title ${{ steps.gitversion.outputs.SemVer }} --notes-file "$RUNNER_TEMP/release-notes.md"