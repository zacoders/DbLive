mode: Mainline

# Version bump by the messages of the merge commit (it holds the PR title) and of the merged commits; the largest
# bump wins, patch when none matches. The PR title decides the version: see "Releases" in Development.md.
# .github/scripts/release-notes.cs reads these three patterns too.
major-version-bump-message: '(?i)(feat!|.*breaking change:.*)'
minor-version-bump-message: '(?i)\bfeat(\s*\(.+\))?:'
patch-version-bump-message: '(?i)\bfix(\s*\(.+\))?:'

branches:
  main:
    regex: ^main$
    is-release-branch: true
    is-mainline: true

ignore:
  sha: []
